name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build isolated public-files-only copy
        run: |
          mkdir "$RUNNER_TEMP/public-candidate"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-candidate"
      - name: Test and validate offline
        working-directory: ${{ runner.temp }}/public-candidate
        run: |
          python3 -m unittest discover -s tests -p 'test*.py' -v
          python3 tools/check_public_release.py --root .
